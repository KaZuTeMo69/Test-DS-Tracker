# Runs the checks on every pull request, so problems show up before merging (the deploy runs them again on main)
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # Types, lint, tests and the build, as `npm run check` runs them locally
      - run: npm run check
